<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORO labs JSON Editor</title>

    <!-- Include JSON Editor CSS and JS from CDN -->
    <link href="https://cloudflare.com" rel="stylesheet" type="text/css">
    <script src="https://cloudflare.com"></script>

    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f4f9; }
        #jsoneditor { width: 100%; height: 500px; }
    </style>
</head>
<body>

    <h2>Internal JSON Editor</h2>
    <div id="jsoneditor"></div>

    <script>
        // Target the container element
        const container = document.getElementById("jsoneditor");
        
        // Configuration choices (Tree view, Code view, etc.)
        const options = {
            mode: 'tree',
            modes: ['tree', 'code', 'text', 'preview'] 
        };
        
        // Initialize the editor
        const editor = new JSONEditor(container, options);

        // Optional: Set initial placeholder data
        const initialJson = { "welcome": "Hello Team!", "project": "JSON Testing", "active": true };
        editor.set(initialJson);
    </script>
</body>
</html>
