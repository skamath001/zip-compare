<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Team JSON Editor</title>

    <!-- Pointing directly to the local files you created in Steps 1 & 2 -->
    <link href="jsoneditor.css" rel="stylesheet" type="text/css">
    <script src="jsoneditor.js"></script>

    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            padding: 30px; 
            background: #f4f4f9; 
        }
        #jsoneditor { 
            width: 100%; 
            height: 600px; 
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <h2>Internal JSON Editor</h2>
    <div id="jsoneditor"></div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            try {
                const container = document.getElementById("jsoneditor");
                
                const options = {
                    mode: 'tree',
                    modes: ['tree', 'code', 'text', 'preview']
                };
                
                // Construct the editor cleanly
                const editor = new JSONEditor(container, options);

                const initialJson = { 
                    "welcome": "Success!", 
                    "status": "Your editor is live and locally hosted", 
                    "security": "100% private. Data never leaves your tab." 
                };
                editor.set(initialJson);
                
                console.log("JSON Editor successfully mounted!");
            } catch (error) {
                console.error("Failed to initialize JSON Editor:", error);
            }
        });
    </script>
</body>
</html>
